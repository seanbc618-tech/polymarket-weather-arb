[project]
name = "polymarket-weather-arb"
version = "0.1.4"
description = "CLI-first Polymarket weather market arbitrage research and trading MVP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "polymarket-client>=0.1.0b16",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dateutil>=2.9.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.8.0",
]
packaging = [
    "pyinstaller>=6.3.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
polymarket-weather = "polymarket_weather_arb.cli:app"
polymarket-weather-desktop = "polymarket_weather_arb.desktop.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
